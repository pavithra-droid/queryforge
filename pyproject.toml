[project]
name = "queryforge"
version = "0.1.0"
description = "An asynchronous question-answering platform with source retrieval"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.5,<6",
    "django>=5.2,<5.3",
    "djangorestframework>=3.18.3",
    "httpx>=0.28.1",
    "ipython>=9.18.1",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py", "tests.py"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]
extend-exclude = ["src/questions/migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: unused imports/variables, undefined names
    "I",   # isort: import ordering
    "B",   # flake8-bugbear: likely bugs
    "UP",  # pyupgrade: modern Python syntax
    "DJ",  # flake8-django: Django-specific pitfalls
    "SIM", # flake8-simplify
]

[tool.ruff.format]
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
# Django-generated settings keep the long validator paths as-is.
"src/config/settings.py" = ["E501"]
